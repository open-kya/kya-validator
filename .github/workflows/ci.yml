# kya-validator/.github/workflows/ci.yml
name: CI

# Manual trigger only - no automatic runs
on:
  workflow_dispatch:
    inputs:
      enable_publish:
        description: 'Enable publish to crates.io, PyPI, and GitHub Releases'
        type: boolean
        default: false

# Minimal permissions for CI - escalated only when enable_publish is true
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './'

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build Python bindings
        run: |
          uv sync
          uv run maturin develop

      - name: Lint Python
        run: uv run ruff check apps/demo_backend/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: cd apps/ui && npm ci

      - name: Lint frontend
        run: cd apps/ui && npm run lint

      - name: Test frontend
        run: cd apps/ui && npm run test:unit

  # Publish Rust crate to crates.io (requires enable_publish: true)
  publish-crates:
    name: Publish Rust Crate
    needs: [rust]
    if: github.event.inputs.enable_publish == 'true'
    runs-on: ubuntu-latest
    # Escalated permissions for publishing
    permissions:
      contents: write
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build (dry-run)
        run: cargo build --release

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}

  # Publish Python package to PyPI using trusted publishing (OIDC)
  # (requires enable_publish: true)
  publish-pypi:
    name: Publish Python Package
    needs: [python-bindings]
    if: github.event.inputs.enable_publish == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing uses OIDC - no token needed, but need permissions
    permissions:
      id-token: write  # Required for OIDC trusted publishing to PyPI
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/kya-validator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build package
        run: |
          uv sync
          uv run maturin build --release

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: target/wheels

  # Create GitHub release with assets (requires enable_publish: true)
  github-release:
    name: Create GitHub Release
    needs: [publish-crates, publish-pypi]
    if: github.event.inputs.enable_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: astral-sh/setup-uv@v4

      - name: Build release artifacts
        run: |
          uv sync
          uv run maturin build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wheels/*.whl
          generate_release_notes: true
          name: ${{ github.ref_name }}
          draft: false
